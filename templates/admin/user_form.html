{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
    <h1>{{ heading }}</h1>

    <form method="post">
        <label for="name">Όνομα</label>
        <input id="name" name="name" value="{{ user.name or '' }}" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ user.email or '' }}" required>

        <label for="role">Ρόλος</label>
        <select id="role" name="role">
            <option value="user" {% if user.role != "admin" %}selected{% endif %}>Χρήστης</option>
            <option value="admin" {% if user.role == "admin" %}selected{% endif %}>Διαχειριστής</option>
        </select>

        {% if is_new %}
            <label for="password">Κωδικός (τουλάχιστον 6 χαρακτήρες)</label>
            <input id="password" name="password" type="password" required>
        {% else %}
            <label for="password">Νέος κωδικός (αφήστε κενό για να μην αλλάξει)</label>
            <input id="password" name="password" type="password">
        {% endif %}

        <button type="submit">Αποθήκευση</button>
    </form>

    <p><a href="{{ url_for('admin.users') }}">Πίσω στη λίστα</a></p>
{% endblock %}
